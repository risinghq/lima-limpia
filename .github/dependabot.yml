version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: java
      - dependency-name: pymdown-extensions
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-svg

  - package-ecosystem: uv
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: java
      - dependency-name: pymdown-extensions
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-svg

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        update-types:
          - major
          - minor
          - patch
    ignore:
      - dependency-name: java
      - dependency-name: pymdown-extensions
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-svg
