name: Setup Copilot environment

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: true
          experimental: true
          github_token: ${{ github.token }}

      - name: Verify mise setup
        run: |
          echo "Mise version: $(mise --version)"
          echo "Bun version: $(bun --version)"
          echo "Biome version: $(biome --version)"
          echo ""
          echo "Available tools:"
          mise list
          echo ""
